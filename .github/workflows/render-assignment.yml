name: Render Assignment 2

on:
  workflow_dispatch:
  push:
    paths:
      - "Assignment 2 - Diana Dominguez.Rmd"
      - ".github/workflows/render-assignment.yml"

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        run: |
          install.packages(c(
            "rmarkdown",
            "knitr",
            "lpSolveAPI"
          ))
        shell: Rscript {0}

      - name: Render notebook
        run: |
          rmarkdown::render(
            "Assignment 2 - Diana Dominguez.Rmd",
            output_file = "Assignment-2-Diana-Dominguez.html"
          )
        shell: Rscript {0}

      - name: Save rendered HTML
        uses: actions/upload-artifact@v4
        with:
          name: Assignment-2-rendered
          path: Assignment-2-Diana-Dominguez.html
